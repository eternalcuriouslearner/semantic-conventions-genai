file_format: definition/2
attributes:
  - key: a2a.method.name
    type:
      members:
        - id: send_message
          value: send_message
          brief: >
            Request to send a message to an agent and receive a non-streaming
            response.
          stability: development
        - id: send_streaming_message
          value: send_streaming_message
          brief: >
            Request to send a message to an agent and receive a streaming
            response.
          stability: development
        - id: get_task
          value: get_task
          brief: >
            Request to get the current state of a task.
          stability: development
        - id: cancel_task
          value: cancel_task
          brief: >
            Request to cancel a task.
          stability: development
        - id: subscribe_to_task
          value: subscribe_to_task
          brief: >
            Request to subscribe to task updates.
          stability: development
        - id: list_tasks
          value: list_tasks
          brief: >
            Request to list tasks.
          stability: development
        - id: create_task_push_notification_config
          value: create_task_push_notification_config
          brief: >
            Request to create or update a task push notification configuration.
          stability: development
        - id: get_task_push_notification_config
          value: get_task_push_notification_config
          brief: >
            Request to get a task push notification configuration.
          stability: development
        - id: list_task_push_notification_configs
          value: list_task_push_notification_configs
          brief: >
            Request to list task push notification configurations.
          stability: development
        - id: delete_task_push_notification_config
          value: delete_task_push_notification_config
          brief: >
            Request to delete a task push notification configuration.
          stability: development
        - id: get_extended_agent_card
          value: get_extended_agent_card
          brief: >
            Request to get the extended agent card.
          stability: development
    brief: The name of the A2A request method.
    note: >
      This attribute records the semconv-normalized, binding-independent name
      of the high-level A2A operation. For example, `send_message` corresponds
      to the A2A `SendMessage` operation. In the current A2A specification,
      JSON-RPC and gRPC use `SendMessage`; HTTP+JSON uses `POST /message:send`.
      See the A2A specification for
      [core operations](https://a2a-protocol.org/latest/specification/#31-core-operations)
      and
      [method mappings](https://a2a-protocol.org/latest/specification/#53-method-mapping-reference).
    stability: development
  - key: a2a.protocol.version
    type: string
    brief: The version of the A2A protocol used.
    note: >
      See the A2A specification for
      [versioning](https://a2a-protocol.org/latest/specification/#36-versioning).
    examples: ["1.0"]
    stability: development
  - key: a2a.protocol.binding
    type:
      members:
        - id: jsonrpc
          value: JSONRPC
          brief: >
            JSON-RPC 2.0 transport binding.
          stability: development
        - id: grpc
          value: GRPC
          brief: >
            gRPC transport binding.
          stability: development
        - id: http_json
          value: HTTP+JSON
          brief: >
            HTTP+JSON/REST transport binding.
          stability: development
    brief: The underlying transport or transport binding used.
    note: >
      The well-known values match the transport protocol identifiers defined
      by the A2A specification for
      [protocol bindings](https://a2a-protocol.org/latest/specification/#5-protocol-binding-requirements-and-interoperability).
    stability: development
  - key: a2a.message.id
    type: string
    brief: The unique identifier of the A2A message.
    note: >
      See the A2A specification for the
      [Message](https://a2a-protocol.org/latest/specification/#414-message)
      object.
    examples: ["msg-user-1234"]
    stability: development
  - key: a2a.message.reference_task_ids
    type: string[]
    brief: Task IDs referenced by the A2A request message.
    note: >
      See the A2A specification for the
      [Message](https://a2a-protocol.org/latest/specification/#414-message)
      object.
    examples:
      - [task-abc-5678]
    stability: development
  - key: a2a.agent_card.url
    type: string
    brief: The endpoint URL of the target A2A agent's Agent Card.
    note: >
      See the A2A specification for
      [Agent Card discovery](https://a2a-protocol.org/latest/specification/#8-agent-discovery-the-agent-card)
      and the
      [AgentCard](https://a2a-protocol.org/latest/specification/#441-agentcard)
      object.
    examples: ["https://a2a-protocol.org/example/a2a/v1/card"]
    stability: development
  - key: a2a.protocol.requested_extensions
    type: string[]
    brief: Protocol extensions requested by the client.
    note: >
      See the A2A specification for
      [extensions](https://a2a-protocol.org/latest/specification/#46-extensions).
    examples:
      - ["https://a2a-protocol.org/example/extensions/auth-forward/v1"]
    stability: development
  - key: a2a.protocol.activated_extensions
    type: string[]
    brief: Protocol extensions successfully activated by the server for this request.
    note: >
      See the A2A specification for
      [extensions](https://a2a-protocol.org/latest/specification/#46-extensions).
    examples:
      - ["https://a2a-protocol.org/example/extensions/auth-forward/v1"]
    stability: development
  - key: a2a.task.id
    type: string
    brief: The unique identifier of an A2A task.
    note: >
      See the A2A specification for the
      [Task](https://a2a-protocol.org/latest/specification/#411-task)
      object and
      [task identifier semantics](https://a2a-protocol.org/latest/specification/#342-task-identifier-semantics).
    examples: ["task-5f2a7c7d9f8e4d2a"]
    stability: development
  - key: a2a.task.state
    type:
      members:
        - id: submitted
          value: submitted
          brief: >
            The task has been submitted.
          stability: development
        - id: working
          value: working
          brief: >
            The task is being processed.
          stability: development
        - id: input_required
          value: input-required
          brief: >
            The task requires additional input.
          stability: development
        - id: completed
          value: completed
          brief: >
            The task completed successfully.
          stability: development
        - id: canceled
          value: canceled
          brief: >
            The task was canceled.
          stability: development
        - id: failed
          value: failed
          brief: >
            The task failed.
          stability: development
        - id: rejected
          value: rejected
          brief: >
            The task was rejected.
          stability: development
        - id: auth_required
          value: auth-required
          brief: >
            The task requires authentication.
          stability: development
        - id: unspecified
          value: unspecified
          brief: >
            The task state is unspecified.
          stability: development
    brief: The state of an A2A task.
    note: >
      See the A2A specification for
      [TaskState](https://a2a-protocol.org/latest/specification/#413-taskstate).
    stability: development
