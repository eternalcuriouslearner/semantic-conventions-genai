runner: genai-conformance
instrumented_library: a2a-python
instrumentation_library: reference

server:
  run: python reference/scenarios/a2a-python/mock_server.py --host 127.0.0.1 --port ${PORT}

env:
  MOCK_LLM_URL: ${MOCK_SERVER_URL}

scenarios:
  reference:
    run: uv run --frozen --python 3.12 --project . python scenario.py
    spans:
      - match:
          attributes:
            a2a.method.name: SendMessage
          kind: client
          type: a2a.client
      - match:
          attributes:
            a2a.method.name: SendStreamingMessage
          kind: client
          type: a2a.client
      - match:
          attributes:
            a2a.method.name: GetTask
          kind: client
          type: a2a.client
